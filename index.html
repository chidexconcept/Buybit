<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuyBit - Instant Crypto Trading</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(18, 24, 38, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-neon: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.25);
            --accent-purple: #7000ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 50%, rgba(0, 255, 136, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(7, 9, 14, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary-neon);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-connect {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid var(--primary-neon);
            color: var(--primary-neon);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }

        .btn-connect:hover {
            background: var(--primary-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 80px 20px 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Trade Widget */
        .trade-container {
            display: flex;
            justify-content: center;
            margin: 20px auto 80px auto;
            padding: 0 20px;
        }

        .trade-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .trade-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-neon), transparent);
        }

        .trade-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            background: rgba(11, 14, 20, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-neon), #00cc6a);
            color: var(--bg-dark);
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--primary-glow);
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 255, 136, 0.4);
        }

        /* Market Table */
        .market-container {
            max-width: 950px;
            margin: 0 auto 100px auto;
            padding: 0 20px;
        }

        .market-container h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .crypto-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .crypto-table th {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            padding: 18px 24px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        .crypto-table td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--card-border);
            font-weight: 500;
        }

        .crypto-table tr:last-child td {
            border-bottom: none;
        }

        .coin-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-cell img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .positive { color: var(--primary-neon); font-weight: 600; }
        .negative { color: var(--danger); font-weight: 600; }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            .navbar { padding: 16px 5%; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">Buy<span>Bit</span></div>
        <ul class="nav-links">
            <li><a href="#trade">Swap</a></li>
            <li><a href="#markets">Markets</a></li>
        </ul>
        <button id="wallet-btn" class="btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <h1>Trade Crypto Instantly with BuyBit</h1>
        <p>Connect your wallet to execute instant multi-chain digital asset swaps.</p>
    </header>

    <!-- Trade Widget -->
    <section id="trade" class="trade-container">
        <div class="trade-card">
            <h2>Instant Swap</h2>
            <div class="input-group">
                <label for="pay-amount">You Pay (USD)</label>
                <input type="number" id="pay-amount" placeholder="0.00" oninput="calculateReceive()">
            </div>
            <div class="input-group">
                <label for="asset-select">Asset to Purchase</label>
                <select id="asset-select" onchange="calculateReceive()">
                    <option value="bitcoin">Bitcoin (BTC)</option>
                    <option value="ethereum">Ethereum (ETH)</option>
                    <option value="solana">Solana (SOL)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="receive-amount">You Receive (Est.)</label>
                <input type="text" id="receive-amount" placeholder="0.00" readonly>
            </div>
            <button id="trade-btn" class="btn-primary" onclick="executeTrade()">Connect Wallet to Trade</button>
        </div>
    </section>

    <!-- Markets -->
    <section id="markets" class="market-container">
        <h2>Live Market Prices</h2>
        <table class="crypto-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Price (USD)</th>
                    <th>24h Change</th>
                </tr>
            </thead>
            <tbody id="crypto-data">
                <tr>
                    <td colspan="3" style="text-align: center; color: var(--text-muted);">Loading live market data...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <footer>
        <p>&copy; 2026 BuyBit Decentralized Exchange. All rights reserved.</p>
    </footer>

    <script>
        let userWallet = null;
        let prices = { bitcoin: 0, ethereum: 0, solana: 0 };

        async function fetchCryptoPrices() {
            const tableBody = document.getElementById('crypto-data');
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,cardano,binancecoin&order=market_cap_desc');
                const data = await response.json();

                tableBody.innerHTML = '';

                data.forEach(coin => {
                    if (prices.hasOwnProperty(coin.id)) {
                        prices[coin.id] = coin.current_price;
                    }

                    const priceChangeClass = coin.price_change_percentage_24h >= 0 ? 'positive' : 'negative';
                    const priceChangeSign = coin.price_change_percentage_24h >= 0 ? '+' : '';

                    const row = `
                        <tr>
                            <td>
                                <div class="coin-cell">
                                    <img src="${coin.image}" alt="${coin.name}">
                                    <div>
                                        <strong>${coin.name}</strong> 
                                        <span style="color: var(--text-muted); font-size: 0.85rem;">${coin.symbol.toUpperCase()}</span>
                                    </div>
                                </div>
                            </td>
                            <td>$${coin.current_price.toLocaleString()}</td>
                            <td class="${priceChangeClass}">${priceChangeSign}${coin.price_change_percentage_24h.toFixed(2)}%</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
                calculateReceive();
            } catch (error) {
                console.error('Error fetching crypto data:', error);
            }
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userWallet = accounts[0];
                    
                    const shortAccount = `${userWallet.substring(0, 6)}...${userWallet.substring(userWallet.length - 4)}`;
                    document.getElementById('wallet-btn').innerText = shortAccount;
                    
                    const tradeBtn = document.getElementById('trade-btn');
                    tradeBtn.innerText = 'Execute Swap';
                    
                    alert(`Wallet Connected: ${userWallet}`);
                } catch (error) {
                    console.error('User rejected connection', error);
                }
            } else {
                alert('Web3 wallet extension (like MetaMask) not detected in browser.');
            }
        }

        function calculateReceive() {
            const payAmount = parseFloat(document.getElementById('pay-amount').value) || 0;
            const selectedAsset = document.getElementById('asset-select').value;
            const assetPrice = prices[selectedAsset];

            if (assetPrice > 0 && payAmount > 0) {
                const estimatedAmount = (payAmount / assetPrice).toFixed(6);
                document.getElementById('receive-amount').value = estimatedAmount;
            } else {
                document.getElementById('receive-amount').value = '0.00';
            }
        }

        function executeTrade() {
            if (!userWallet) {
                connectWallet();
                return;
            }

            const payAmount = document.getElementById('pay-amount').value;
            const selectedAsset = document.getElementById('asset-select').value.toUpperCase();

            if (!payAmount || payAmount <= 0) {
                alert('Please enter a valid amount to trade.');
                return;
            }

            alert(`Initiating trade for $${payAmount} USD worth of ${selectedAsset}\nConnected Wallet: ${userWallet}`);
        }

        fetchCryptoPrices();
        setInterval(fetchCryptoPrices, 30000);
    </script>
</body>
</html>
